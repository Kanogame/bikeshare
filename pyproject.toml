[project]
name = "bikeshare"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "catboost>=1.2.10",
    "dependency-injector>=4.49.0",
    "fastapi>=0.136.1",
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "matplotlib>=3.10.9",
    "mlflow==3.12.0",
    "numpy>=2.4.5",
    "optuna>=4.8.0",
    "pandas<3",
    "pgvector>=0.4.2",
    "plotly>=6.7.0",
    "protobuf>=3.20,<5",
    "pydantic>=2",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "shap>=0.46.0",
    "sqlalchemy[asyncio]>=2.0.49",
    "statsmodels>=0.14.6",
    "types-seaborn>=0.13.2.20260518",
    "uvicorn[standard]>=0.47.0",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "ruff>=0.15.13",
    "ty>=0.0.37",
]

[tool.ty.environment]
python = ".venv"

[tool.mypy]
plugins = ["sqlalchemy.ext.mypy.plugin","sqlmypy","pydantic.mypy"]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["common/src", "core-api", "optimizer-engine"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade - modernize syntax
    "B",     # flake8-bugbear - common bugs
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific rules
    "TCH",   # flake8-type-checking - move imports into TYPE_CHECKING blocks
    "ANN",   # flake8-annotations
    "S",     # flake8-bandit (security)
    "PTH",   # flake8-use-pathlib
    "PL",    # pylint
    "PERF",  # perflint - performance anti-patterns
    "FURB",  # refurb - modern Python idioms
    "LOG",   # flake8-logging
    "G",     # flake8-logging-format
    "TRY",   # tryceratops - exception handling
    "EM",    # flake8-errmsg - exception messages
    "PT",    # flake8-pytest-style
]
ignore = [
    "ANN401",   # Dynamically typed Any - too strict for general use
    "S101",     # assert - fine in tests and type narrowing
    "TRY003",   # Long exception messages - overly pedantic
    "EM101",    # String literal in exception - common pattern
    "EM102",    # f-string in exception - common pattern
    "PLR2004",  # Magic value comparison - too noisy
    "G004",     # Logging with f-string - widely used pattern
    "RUF001",   # ambiguous unicode character comment - Russian language is permitted in strings
    "RUF002",   # ambiguous unicode character comment - Russian language is permitted in docstrings
    "RUF003",   # ambiguous unicode character comment - Russian language is permitted in comments
    "N818",
    "B008"
]
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["common", "app"]
split-on-trailing-comma = true
force-sort-within-sections = true

[tool.ruff.lint.pylint]
max-args = 8
max-branches = 12
max-returns = 6

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
